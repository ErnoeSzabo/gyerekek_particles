<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Gyerekek-App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#02040a" />

  <!-- Fullscreen / App-Modus für iOS & Android -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Franyó" />
  <link rel="apple-touch-icon" href="icon-192.png" />

  <!-- PWA & Fullscreen-Support für Smartphones (Static Web App) -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#02040a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Franyó" />
  <link rel="apple-touch-icon" href="icon-192.png" />

  <!-- Google Font: Inter (latin-ext für gestochen scharfe ungarische Akzente ó, á) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800;900&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS via CDN (kein Build-Schritt nötig, direkt bereit für Azure Static Web Apps) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Three.js als ES-Modul über CDN -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.170.0/build/three.module.js"
      }
    }
  </script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #02040a;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      color: #ffffff;
    }

    /* Vollbild-Container für das Three.js-Canvas */
    #canvas-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background-color: #02040a;
    }

    #canvas-container canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
      touch-action: none;
      cursor: crosshair;
    }

    /* Kontrastreiche Steuerleiste am unteren Bildschirmrand */
    .control-dock {
      background: rgba(6, 10, 20, 0.86);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow: 0 14px 44px rgba(0, 0, 0, 0.85), inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }

    /* Stil der vier Wort-Schaltflächen mit sehr hohem Kontrast */
    .word-btn {
      position: relative;
      transition: transform 0.18s cubic-bezier(0.22, 1, 0.36, 1),
                  background-color 0.22s ease,
                  border-color 0.22s ease,
                  box-shadow 0.22s ease,
                  color 0.22s ease;
      border: 1.5px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.05);
      color: #cbd5e1;
    }

    .word-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.28);
      color: #ffffff;
    }

    .word-btn:active {
      transform: scale(0.95);
    }

    .word-btn.active {
      color: #ffffff;
      background: var(--btn-bg, rgba(34, 211, 238, 0.24));
      border-color: var(--btn-border, #67e8f9);
      box-shadow: 0 0 22px var(--btn-glow, rgba(34, 211, 238, 0.45)),
                  inset 0 1px 0 rgba(255, 255, 255, 0.35);
      text-shadow: 0 0 10px var(--btn-glow, rgba(34, 211, 238, 0.65));
    }

    /* Dezenter Hinweis oben */
    .hint-pill {
      background: rgba(6, 10, 20, 0.72);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      transition: opacity 0.8s ease;
    }

    .hint-pill.faded {
      opacity: 0.35;
    }

    /* Sicherer Abstand für Smartphones mit Home-Bar */
    .safe-bottom {
      padding-bottom: max(1.1rem, env(safe-area-inset-bottom));
    }
  </style>
</head>
<body class="bg-[#02040a] antialiased">

  <!-- Three.js 3D-Bühne -->
  <div id="canvas-container" aria-label="Interaktive 3D-Partikel-Simulation"></div>

  

  <!-- Untere Steuerleiste mit den vier klar lesbaren Wort-Schaltflächen -->
  <nav
    aria-label="Wortform umschalten"
    class="pointer-events-none fixed bottom-0 inset-x-0 z-20 flex justify-center px-3 sm:px-6 safe-bottom"
  >
    <div class="control-dock pointer-events-auto rounded-2xl p-1.5 sm:p-2 flex items-center justify-center gap-1.5 sm:gap-2.5 w-full max-w-md sm:max-w-lg">
      <button
        type="button"
        data-word="Franyó"
        class="word-btn active flex-1 rounded-xl px-2.5 py-3 sm:px-5 sm:py-3 text-xs sm:text-sm font-bold tracking-wide text-center"
        style="--btn-bg: rgba(6, 182, 212, 0.28); --btn-border: #67e8f9; --btn-glow: rgba(34, 211, 238, 0.5);"
      >
        Franyó
      </button>
      <button
        type="button"
        data-word="Dorián"
        class="word-btn flex-1 rounded-xl px-2.5 py-3 sm:px-5 sm:py-3 text-xs sm:text-sm font-bold tracking-wide text-center"
        style="--btn-bg: rgba(245, 158, 11, 0.28); --btn-border: #fde047; --btn-glow: rgba(251, 191, 36, 0.5);"
      >
        Dorián
      </button>
      <button
        type="button"
        data-word="Masi"
        class="word-btn flex-1 rounded-xl px-2.5 py-3 sm:px-5 sm:py-3 text-xs sm:text-sm font-bold tracking-wide text-center"
        style="--btn-bg: rgba(236, 72, 153, 0.28); --btn-border: #f9a8d4; --btn-glow: rgba(244, 114, 182, 0.5);"
      >
        Masi
      </button>
      <button
        type="button"
        data-word="Lottó"
        class="word-btn flex-1 rounded-xl px-2.5 py-3 sm:px-5 sm:py-3 text-xs sm:text-sm font-bold tracking-wide text-center"
        style="--btn-bg: rgba(16, 185, 129, 0.28); --btn-border: #6ee7b7; --btn-glow: rgba(52, 211, 153, 0.5);"
      >

    </div>
  </nav>

  <!-- Fehlermeldung-Container (kein alert()) -->
  <div id="errorBanner" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-[#02040a]/95 p-6">
    <div class="max-w-md rounded-2xl border border-red-500/40 bg-slate-900/90 p-6 text-center shadow-2xl">
      <h2 class="text-lg font-bold text-white mb-2">WebGL konnte nicht gestartet werden</h2>
      <p id="errorText" class="text-sm text-slate-300">Bitte prüfe, ob dein Browser WebGL unterstützt.</p>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';

    // =========================================================================
    // 1. KONTRASTREICHE FARBPALETTEN FÜR DIE VIER WÖRTER
    // =========================================================================
    const WORD_THEMES = {
      'Franyó': {
        // Leuchtendes Cyan-Weiß
        colorA: new THREE.Color('#e0faff'),
        colorB: new THREE.Color('#22d3ee'),
        colorC: new THREE.Color('#38bdf8'),
        dotColor: '#67e8f9'
      },
      'Dorián': {
        // Helles Gold-Amber
        colorA: new THREE.Color('#fef9c3'),
        colorB: new THREE.Color('#fbbf24'),
        colorC: new THREE.Color('#f59e0b'),
        dotColor: '#fde047'
      },
      'Masi': {
        // Klares Neon-Magenta-Weiß
        colorA: new THREE.Color('#fce7f3'),
        colorB: new THREE.Color('#f472b6'),
        colorC: new THREE.Color('#e879f9'),
        dotColor: '#f9a8d4'
      },
      'Lottó': {
        // Helles Smaragd-Mint
        colorA: new THREE.Color('#d1fae5'),
        colorB: new THREE.Color('#34d399'),
        colorC: new THREE.Color('#2dd4bf'),
        dotColor: '#6ee7b7'
      }
    };

    // DOM-Referenzen
    const container = document.getElementById('canvas-container');
    const hintEl = document.getElementById('interactionHint');
    const hintDotEl = document.getElementById('hintDot');
    const buttons = Array.from(document.querySelectorAll('.word-btn'));
    const errorBanner = document.getElementById('errorBanner');
    const errorText = document.getElementById('errorText');

    // Hohe Partikeldichte (7.400 mobil / 8.600 Desktop) für messerscharfe Typografie
    const isMobileInit = window.innerWidth < 640;
    const PARTICLE_COUNT = isMobileInit ? 7400 : 8600;

    // Simulationszustand
    let scene, camera, renderer, pointsMesh, geometry, material;
    let currentWord = 'Franyó';
    let hasInteracted = false;
    let currentWordBounds = { width: 15, height: 5.2 };
    // Temporärer Boost für flüssige Wort-Wechsel (~1,5–2 s), danach sanfte, langsame Rückkehrphysik
    let morphBoost = 0;

    // 3D-Kameraparallaxe
    let camRotX = 0;
    let camRotY = 0;
    let targetCamRotX = 0;
    let targetCamRotY = 0;

    // Buffer-Arrays für maximale Performance (TypedArrays)
    const positions = new Float32Array(PARTICLE_COUNT * 3);
    const velocities = new Float32Array(PARTICLE_COUNT * 3);
    const targets = new Float32Array(PARTICLE_COUNT * 3);
    const colors = new Float32Array(PARTICLE_COUNT * 3);
    const targetColors = new Float32Array(PARTICLE_COUNT * 3);
    const sizes = new Float32Array(PARTICLE_COUNT);
    const energies = new Float32Array(PARTICLE_COUNT);

    // Individuelle Schwirr- & Feder-Parameter pro Partikel
    const phasesX = new Float32Array(PARTICLE_COUNT);
    const phasesY = new Float32Array(PARTICLE_COUNT);
    const phasesZ = new Float32Array(PARTICLE_COUNT);
    const freqs = new Float32Array(PARTICLE_COUNT);
    const amps = new Float32Array(PARTICLE_COUNT);
    const springKs = new Float32Array(PARTICLE_COUNT);

    // Individuelle Schweif-Parameter pro Partikel (natürlicher Kometen-Schweif statt Ball)
    const followWeights = new Float32Array(PARTICLE_COUNT);
    const followPointerIds = new Array(PARTICLE_COUNT).fill(null);
    const trailLags = new Float32Array(PARTICLE_COUNT);
    const lateralOffsets = new Float32Array(PARTICLE_COUNT);
    const zOffsets = new Float32Array(PARTICLE_COUNT);
    const curlPhases = new Float32Array(PARTICLE_COUNT);
    const TRAIL_MAX_POINTS = 44;

    // Cache für abgetastete Wort-Punkte (sofortiger Wechsel ohne Ruckeln)
    const sampledWordCache = new Map();

    // Aktive Zeiger (Maus + Multi-Touch) in 3D-Weltkoordinaten auf Ebene Z = 0
    const activePointers = new Map();
    const raycaster = new THREE.Raycaster();
    const interactionPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
    const tmpNdc = new THREE.Vector2();
    const tmpWorldPos = new THREE.Vector3();

    // =========================================================================
    // 2. HOCHAUFLÖSENDES TEXT-SAMPLING (GESTROCHEN SCHARFE BUCHSTABEN & AKZENTE)
    // =========================================================================
    function sampleWordPoints(word) {
      if (sampledWordCache.has(word)) {
        return sampledWordCache.get(word);
      }

      const off = document.createElement('canvas');
      off.width = 1600;
      off.height = 520;
      const octx = off.getContext('2d', { willReadFrequently: true });

      octx.clearRect(0, 0, off.width, off.height);
      octx.fillStyle = '#ffffff';
      octx.textAlign = 'center';
      octx.textBaseline = 'middle';

      // Sehr klare, fette, moderne Schriftart
      const fontStack = "'Inter', 'Arial Black', 'Segoe UI', system-ui, sans-serif";
      let fontSize = 265;
      octx.font = `900 ${fontSize}px ${fontStack}`;

      // Etwas zusätzlicher Buchstabenabstand für perfekte Trennung & Lesbarkeit
      if ('letterSpacing' in octx) {
        octx.letterSpacing = '10px';
      }

      // Falls das Wort breiter als der sichere Bereich ist, sauber herunterskalieren
      while (octx.measureText(word).width > off.width * 0.84 && fontSize > 110) {
        fontSize -= 8;
        octx.font = `900 ${fontSize}px ${fontStack}`;
      }

      // Text mittig mit extra Kopffreiheit für ungarische Akzente (ó, á) zeichnen
      octx.fillText(word, off.width / 2, off.height * 0.56);

      const img = octx.getImageData(0, 0, off.width, off.height);
      const data = img.data;

      // Feine Abtastung (Schrittweite 2 Pixel) für exakte Konturen & Akzente
      const step = 2;
      const rawPoints = [];
      let minX = off.width;
      let maxX = 0;
      let minY = off.height;
      let maxY = 0;

      for (let y = 0; y < off.height; y += step) {
        for (let x = 0; x < off.width; x += step) {
          const alpha = data[(y * off.width + x) * 4 + 3];
          // Hoher Schwellenwert (155) verhindert unscharfe Anti-Aliasing-Ränder
          if (alpha > 155) {
            if (x < minX) minX = x;
            if (x > maxX) maxX = x;
            if (y < minY) minY = y;
            if (y > maxY) maxY = y;
            rawPoints.push(x, y);
          }
        }
      }

      const pixelW = Math.max(1, maxX - minX);
      const pixelH = Math.max(1, maxY - minY);
      const centerX = (minX + maxX) * 0.5;
      const centerY = (minY + maxY) * 0.5;

      // Einheitliche 3D-Weltgröße berechnen (sowohl breite als auch kurze Wörter optimal proportioniert)
      const maxWorldWidth = 15.2;
      const maxWorldHeight = 5.4;
      const worldScale = Math.min(maxWorldWidth / pixelW, maxWorldHeight / pixelH);

      const count = rawPoints.length / 2;
      const points = new Array(count);

      // Leicht nach oben versetzt, damit unten Platz für die 4 Schaltflächen bleibt
      const verticalLift = 0.55;

      for (let i = 0; i < count; i++) {
        const px = rawPoints[i * 2];
        const py = rawPoints[i * 2 + 1];
        const u = (px - minX) / pixelW; // 0..1 links -> rechts für Farbverlauf
        const v = (py - minY) / pixelH; // 0..1 oben -> unten

        points[i] = {
          x: (px - centerX) * worldScale,
          y: -(py - centerY) * worldScale + verticalLift,
          // Sehr geringe Z-Tiefe im Ruhezustand, damit die Schrift niemals verschwimmt
          z: (Math.random() - 0.5) * 0.24,
          u,
          v
        };
      }

      // Fisher-Yates-Shuffle für gleichmäßige Verteilung über alle Buchstaben & Akzente
      for (let i = points.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const tmp = points[i];
        points[i] = points[j];
        points[j] = tmp;
      }

      const result = {
        points,
        bounds: {
          width: pixelW * worldScale,
          height: pixelH * worldScale
        }
      };

      sampledWordCache.set(word, result);
      return result;
    }

    // =========================================================================
    // 3. CUSTOM SHADER FÜR SCHARFEN WEISSEN KERN & LEUCHTENDEN FARBSCHEIN
    // =========================================================================
    const vertexShader = `
      attribute float aSize;
      attribute float aEnergy;
      varying vec3 vColor;
      varying float vEnergy;

      uniform float uPixelRatio;
      uniform float uSizeScale;

      void main() {
        vColor = color;
        vEnergy = aEnergy;

        vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
        float dist = max(1.0, -mvPosition.z);

        // Partikel werden bei Berührung leicht größer und strahlender
        float energyBoost = 1.0 + aEnergy * 0.72;
        gl_PointSize = aSize * energyBoost * uPixelRatio * (uSizeScale / dist);
        gl_Position = projectionMatrix * mvPosition;
      }
    `;

    const fragmentShader = `
      varying vec3 vColor;
      varying float vEnergy;

      void main() {
        // Abstand vom Mittelpunkt des Partikels (0.0 bis 0.5)
        vec2 c = gl_PointCoord - vec2(0.5);
        float d = length(c);
        if (d > 0.5) discard;

        // Gestochen scharfer, extrem heller weißer Kern
        float core = smoothstep(0.26, 0.04, d);

        // Leuchtender, klar abgegrenzter Farbschein um den Kern
        float halo = pow(max(0.0, 1.0 - d * 2.0), 2.1);

        // Kern strahlt reinweiß; im Schweif leuchten Partikel subtil heller und wärmer auf
        vec3 warmHighlight = mix(vColor, vec3(1.0, 0.96, 0.88), vEnergy * 0.42);
        vec3 baseGlow = mix(warmHighlight, vec3(1.0), core * 0.88 + vEnergy * 0.48);

        // Hohe Helligkeit für maximalen Kontrast auf #02040a
        float alpha = clamp(core * 0.96 + halo * (0.62 + vEnergy * 0.24), 0.0, 1.0);
        gl_FragColor = vec4(baseGlow, alpha);
      }
    `;

    // =========================================================================
    // 4. THREE.JS SZENE & PARTIKELSYSTEM INITIALISIEREN
    // =========================================================================
    function initThree() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color('#02040a');

      const w = window.innerWidth;
      const h = window.innerHeight;
      camera = new THREE.PerspectiveCamera(42, w / h, 0.1, 150);

      renderer = new THREE.WebGLRenderer({
        antialias: true,
        powerPreference: 'high-performance',
        alpha: false
      });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(w, h);
      renderer.setClearColor(0x02040a, 1);
      container.appendChild(renderer.domElement);

      // Partikel-Eigenschaften initialisieren
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        phasesX[i] = Math.random() * Math.PI * 2;
        phasesY[i] = Math.random() * Math.PI * 2;
        phasesZ[i] = Math.random() * Math.PI * 2;
        // Sehr ruhiges, langsames Schimmern im Ruhezustand
        freqs[i] = 0.65 + Math.random() * 0.85;
        amps[i] = 0.018 + Math.random() * 0.028;
        // Sehr sanfte, überdämpfte Federkraft für langsames, geschmeidiges Zurückgleiten (~2,5–4 s)
        springKs[i] = 0.0020 + Math.random() * 0.0010;
        sizes[i] = (isMobileInit ? 1.05 : 1.15) + Math.random() * 0.55;
        energies[i] = 0;

        // Natürliche Schweif-Eigenschaften vorinitialisieren
        followWeights[i] = 0;
        followPointerIds[i] = null;
        trailLags[i] = 0.05 + Math.pow(Math.random(), 0.85) * 0.95;
        lateralOffsets[i] = (Math.random() - 0.5) * 2.0;
        zOffsets[i] = (Math.random() - 0.5) * 2.0;
        curlPhases[i] = Math.random() * Math.PI * 2;
      }

      geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
      geometry.setAttribute('aSize', new THREE.BufferAttribute(sizes, 1));
      geometry.setAttribute('aEnergy', new THREE.BufferAttribute(energies, 1));

      material = new THREE.ShaderMaterial({
        vertexShader,
        fragmentShader,
        transparent: true,
        depthWrite: false,
        vertexColors: true,
        blending: THREE.AdditiveBlending,
        uniforms: {
          uPixelRatio: { value: renderer.getPixelRatio() },
          uSizeScale: { value: isMobileInit ? 76.0 : 88.0 }
        }
      });

      pointsMesh = new THREE.Points(geometry, material);
      scene.add(pointsMesh);
    }

    // =========================================================================
    // 5. WORT-WECHSEL & 3D-WIRBEL-MORPHING
    // =========================================================================
    function applyWord(word, isInitial = false) {
      if (!WORD_THEMES[word]) return;
      currentWord = word;
      // Kurzer Morph-Boost beim Laden/Umschalten, damit das neue Wort geschmeidig in ~1,5–2 s entsteht
      morphBoost = 1.0;
      followWeights.fill(0);
      followPointerIds.fill(null);

      const theme = WORD_THEMES[word];
      const sampled = sampleWordPoints(word);
      const pts = sampled.points;
      currentWordBounds = sampled.bounds;

      if (!pts || pts.length === 0) return;

      // UI-Buttons & Hinweis-Punkt aktualisieren
      if (hintDotEl) {
        hintDotEl.style.backgroundColor = theme.dotColor;
      }
      buttons.forEach((btn) => {
        btn.classList.toggle('active', btn.dataset.word === word);
      });

      const tmpColor = new THREE.Color();
      const ptCount = pts.length;

      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const pt = pts[i % ptCount];
        const i3 = i * 3;

        // Minimaler Subpixel-Jitter, falls mehr Partikel als Rasterpunkte existieren
        const jitter = i >= ptCount ? 0.042 : 0.014;
        const tx = pt.x + (Math.random() - 0.5) * jitter;
        const ty = pt.y + (Math.random() - 0.5) * jitter;
        const tz = pt.z;

        targets[i3] = tx;
        targets[i3 + 1] = ty;
        targets[i3 + 2] = tz;

        // Beim Wort-Wechsel aktiven Schweif sanft lösen, damit das neue Wort sauber entsteht
        followWeights[i] = 0;
        followPointerIds[i] = null;

        // Kontrastreicher heller Farbverlauf (Weiß-Akzent oben/mittig -> leuchtende Wortfarbe)
        if (pt.u < 0.5) {
          tmpColor.copy(theme.colorA).lerp(theme.colorB, pt.u * 2.0);
        } else {
          tmpColor.copy(theme.colorB).lerp(theme.colorC, (pt.u - 0.5) * 2.0);
        }
        // Leichte Aufhellung im oberen Bereich (hebt auch ungarische Akzente brillant hervor)
        if (pt.v < 0.35) {
          tmpColor.lerp(theme.colorA, (0.35 - pt.v) * 0.9);
        }

        targetColors[i3] = tmpColor.r;
        targetColors[i3 + 1] = tmpColor.g;
        targetColors[i3 + 2] = tmpColor.b;

        if (isInitial) {
          // Sanfter 3D-Einflug beim ersten Laden direkt in "Franyó"
          const angle = Math.random() * Math.PI * 2;
          const dist = 1.6 + Math.random() * 4.5;
          positions[i3] = tx + Math.cos(angle) * dist;
          positions[i3 + 1] = ty + Math.sin(angle) * dist;
          positions[i3 + 2] = tz + (Math.random() - 0.5) * 4.0;

          colors[i3] = tmpColor.r;
          colors[i3 + 1] = tmpColor.g;
          colors[i3 + 2] = tmpColor.b;
          energies[i] = 0.18;
        } else {
          // Ruhiger, eleganter Übergang beim Wort-Wechsel ohne chaotischen Wirbel
          const px = positions[i3];
          const py = positions[i3 + 1];
          const driftAngle = Math.atan2(py, px) + Math.PI * 0.35;
          const driftPower = 0.022 + Math.random() * 0.032;

          velocities[i3] += Math.cos(driftAngle) * driftPower;
          velocities[i3 + 1] += Math.sin(driftAngle) * driftPower;
          velocities[i3 + 2] += (Math.random() - 0.5) * 0.12;
          energies[i] = Math.min(0.65, energies[i] + 0.25);
        }
      }

      geometry.attributes.position.needsUpdate = true;
      geometry.attributes.color.needsUpdate = true;
      geometry.attributes.aEnergy.needsUpdate = true;

      fitCameraToWord();
    }

    // =========================================================================
    // 6. RESPONSIVE KAMERA-ANPASSUNG (HOCHFORMAT & QUERFORMAT)
    // =========================================================================
    function fitCameraToWord() {
      if (!camera) return;
      const w = window.innerWidth;
      const h = window.innerHeight;
      const aspect = w / Math.max(1, h);

      camera.aspect = aspect;
      camera.updateProjectionMatrix();

      const vFov = THREE.MathUtils.degToRad(camera.fov);
      const tanHalfV = Math.tan(vFov * 0.5);
      const tanHalfH = tanHalfV * aspect;

      // Wortbreite & -höhe mit sicherem Rand für Hoch- und Querformat
      const targetW = Math.max(12.5, currentWordBounds.width) * (aspect < 1 ? 1.24 : 1.38);
      const targetH = Math.max(5.2, currentWordBounds.height) * 1.95;

      const distH = (targetW * 0.5) / tanHalfH;
      const distV = (targetH * 0.5) / tanHalfV;
      const dist = Math.max(distH, distV, 16.5);

      camera.position.set(0, 0, dist);
      camera.lookAt(0, 0, 0);

      if (material) {
        material.uniforms.uSizeScale.value = (aspect < 1 ? 74.0 : 88.0) * (dist / 22.0);
      }
    }

    function onResize() {
      if (!renderer || !camera) return;
      const w = window.innerWidth;
      const h = window.innerHeight;
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(w, h);
      if (material) {
        material.uniforms.uPixelRatio.value = renderer.getPixelRatio();
      }
      fitCameraToWord();
    }

    // =========================================================================
    // 7. ZEIGER-, TOUCH- & BUTTON-INTERAKTION
    // =========================================================================
    function markInteracted() {
      if (!hasInteracted) {
        hasInteracted = true;
        if (hintEl) {
          hintEl.classList.add('faded');
        }
      }
    }

    function screenToWorld(clientX, clientY) {
      const rect = renderer.domElement.getBoundingClientRect();
      tmpNdc.x = ((clientX - rect.left) / rect.width) * 2 - 1;
      tmpNdc.y = -((clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(tmpNdc, camera);
      raycaster.ray.intersectPlane(interactionPlane, tmpWorldPos);
      return tmpWorldPos;
    }

    function updatePointer(id, clientX, clientY, isDown = false) {
      const world = screenToWorld(clientX, clientY);
      const prev = activePointers.get(id);

      if (!prev) {
        activePointers.set(id, {
          x: world.x,
          y: world.y,
          vx: 0,
          vy: 0,
          speed: 0,
          isDown,
          tx: 1,
          ty: 0,
          nx: 0,
          ny: 1,
          trail: [{ x: world.x, y: world.y, tx: 1, ty: 0, nx: 0, ny: 1 }]
        });
      } else {
        const rawVx = world.x - prev.x;
        const rawVy = world.y - prev.y;
        const stepDist = Math.hypot(rawVx, rawVy);

        // Geglättete & begrenzte Zeigergeschwindigkeit für ruhige, seidige Bewegungen
        const vx = THREE.MathUtils.clamp(prev.vx * 0.58 + rawVx * 0.42, -0.52, 0.52);
        const vy = THREE.MathUtils.clamp(prev.vy * 0.58 + rawVy * 0.42, -0.52, 0.52);

        let tx = prev.tx;
        let ty = prev.ty;
        let nx = prev.nx;
        let ny = prev.ny;

        // Pfad-Historie nur bei echter Bewegung fortschreiben (verhindert Ball-Bildung im Stillstand)
        if (stepDist > 0.035) {
          const dirX = rawVx / stepDist;
          const dirY = rawVy / stepDist;
          // Tangente sanft glätten
          const stx = tx * 0.68 + dirX * 0.32;
          const sty = ty * 0.68 + dirY * 0.32;
          const tLen = Math.hypot(stx, sty) || 1;
          tx = stx / tLen;
          ty = sty / tLen;
          nx = -ty;
          ny = tx;

          // Bei schnellen Zügen Zwischenpunkte interpolieren für einen lückenlosen Schweif
          const subSteps = Math.min(6, Math.max(1, Math.ceil(stepDist / 0.22)));
          for (let s = 1; s <= subSteps; s++) {
            const frac = s / subSteps;
            prev.trail.unshift({
              x: prev.x + rawVx * frac,
              y: prev.y + rawVy * frac,
              tx,
              ty,
              nx,
              ny
            });
          }
          if (prev.trail.length > TRAIL_MAX_POINTS) {
            prev.trail.length = TRAIL_MAX_POINTS;
          }
        }

        prev.x = world.x;
        prev.y = world.y;
        prev.vx = vx;
        prev.vy = vy;
        prev.speed = Math.hypot(vx, vy);
        prev.isDown = isDown;
        prev.tx = tx;
        prev.ty = ty;
        prev.nx = nx;
        prev.ny = ny;
      }

      // Sehr dezente 3D-Neigung (bleibt jederzeit perfekt lesbar)
      const nxScreen = (clientX / window.innerWidth - 0.5) * 2;
      const nyScreen = (clientY / window.innerHeight - 0.5) * 2;
      targetCamRotY = nxScreen * 0.06;
      targetCamRotX = nyScreen * 0.04;
    }

    function removePointer(id) {
      activePointers.delete(id);
      if (activePointers.size === 0) {
        targetCamRotX = 0;
        targetCamRotY = 0;
      }
    }

    function bindEvents() {
      const dom = renderer.domElement;

      // Maus-Interaktion (sanftes Mitziehen bei Bewegung, besonders starkes Folgen bei gedrückter Taste)
      dom.addEventListener('mousemove', (e) => {
        markInteracted();
        updatePointer('mouse', e.clientX, e.clientY, (e.buttons & 1) === 1);
      });

      dom.addEventListener('mousedown', (e) => {
        markInteracted();
        updatePointer('mouse', e.clientX, e.clientY, true);
      });

      window.addEventListener('mouseup', () => {
        const ptr = activePointers.get('mouse');
        if (ptr) {
          ptr.isDown = false;
        }
      });

      dom.addEventListener('mouseleave', () => {
        removePointer('mouse');
      });

      // Touch-Interaktion (Single- & Multi-Touch ohne Scrollen)
      dom.addEventListener('touchstart', (e) => {
        e.preventDefault();
        markInteracted();
        for (let i = 0; i < e.changedTouches.length; i++) {
          const t = e.changedTouches[i];
          updatePointer(t.identifier, t.clientX, t.clientY, true);
        }
      }, { passive: false });

      dom.addEventListener('touchmove', (e) => {
        e.preventDefault();
        for (let i = 0; i < e.changedTouches.length; i++) {
          const t = e.changedTouches[i];
          updatePointer(t.identifier, t.clientX, t.clientY, true);
        }
      }, { passive: false });

      const onTouchEnd = (e) => {
        for (let i = 0; i < e.changedTouches.length; i++) {
          removePointer(e.changedTouches[i].identifier);
        }
      };
      dom.addEventListener('touchend', onTouchEnd);
      dom.addEventListener('touchcancel', onTouchEnd);

      // Schaltflächen für die 4 Wörter
      buttons.forEach((btn) => {
        btn.addEventListener('click', () => {
          const word = btn.dataset.word;
          if (word && word !== currentWord) {
            applyWord(word, false);
          } else if (word === currentWord) {
            // Erneutes Tippen auf das aktive Wort löst einen kleinen Glanz-Impuls aus
            applyWord(word, false);
          }
        });
      });

      // Responsive Anpassung bei Fenstergröße / Geräte-Drehung
      window.addEventListener('resize', onResize);
    }

    // =========================================================================
    // 8. PHYSIK- & RENDER-SCHLEIFE (60 FPS SPRING-DAMPING)
    // =========================================================================
    let lastTime = 0;

    function animate(now) {
      requestAnimationFrame(animate);

      const elapsedMs = now - lastTime;
      lastTime = now;
      // Normalisiertes Delta-Time-Maß bezogen auf 60 FPS (gekappt bei Tab-Wechsel)
      const dt = Math.max(0.2, Math.min(elapsedMs / 16.6667, 2.2));
      const t = now * 0.001;

      // Sanfte 3D-Kameraparallaxe
      camRotX += (targetCamRotX - camRotX) * Math.min(1, 0.06 * dt);
      camRotY += (targetCamRotY - camRotY) * Math.min(1, 0.06 * dt);
      if (pointsMesh) {
        pointsMesh.rotation.x = camRotX;
        pointsMesh.rotation.y = camRotY;
      }

      // Temporären Morph-Boost beim Wort-Wechsel weich abbauen
      morphBoost = Math.max(0, morphBoost - 0.012 * dt);
      const springMultiplier = 1.0 + morphBoost * 4.5;
      const damping = Math.pow(0.922, dt);
      const colorLerp = Math.min(1, 0.045 * dt);
      const energyDecay = Math.pow(0.955, dt);

      // Maximale Partikelgeschwindigkeit begrenzen, damit Bewegungen immer ruhig bleiben
      const maxSpeed = 0.26 + morphBoost * 0.18;
      const maxSpeedSq = maxSpeed * maxSpeed;

      // Kleiner, präziser Interaktionsradius (~8 % der Wortbreite, wie eine Fingerspitze)
      const interactRadius = Math.max(1.05, Math.min(1.42, currentWordBounds.width * 0.082));
      const interactRadiusSq = interactRadius * interactRadius;
      const hasPointers = activePointers.size > 0;

      // Alle Partikel aktualisieren
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const i3 = i * 3;
        let px = positions[i3];
        let py = positions[i3 + 1];
        let pz = positions[i3 + 2];

        let vx = velocities[i3];
        let vy = velocities[i3 + 1];
        let vz = velocities[i3 + 2];

        // 1. Ruhiges, eng begrenztes Atmen um die präzise Textposition
        const f = freqs[i];
        const a = amps[i];
        const liveTx = targets[i3] + Math.sin(t * f + phasesX[i]) * a;
        const liveTy = targets[i3 + 1] + Math.cos(t * f * 0.92 + phasesY[i]) * a;
        const liveTz = targets[i3 + 2] + Math.sin(t * f * 0.8 + phasesZ[i]) * (a * 1.1);

        // 2. Aufnahme in den Schweif innerhalb des kleinen Fingerspitzen-Radius
        if (hasPointers) {
          activePointers.forEach((ptr, ptrId) => {
            const dx = px - ptr.x;
            const dy = py - ptr.y;
            const distSq = dx * dx + dy * dy;

            if (distSq < interactRadiusSq) {
              const dist = Math.sqrt(distSq);
              const factor = 1.0 - dist / interactRadius;
              const smoothFactor = factor * factor;

              // Beim ersten Aufnehmen individuelle Position entlang des Schweifs festlegen
              if (followWeights[i] < 0.2 || followPointerIds[i] !== ptrId) {
                followPointerIds[i] = ptrId;
                trailLags[i] = 0.05 + Math.pow(Math.random(), 0.85) * 0.95;
                // Seitlichen Versatz organisch an der Eintrittsseite orientieren
                const sideProj = (dx * ptr.nx + dy * ptr.ny) / interactRadius;
                lateralOffsets[i] = THREE.MathUtils.clamp(
                  sideProj * 0.65 + (Math.random() - 0.5) * 1.35,
                  -1.25,
                  1.25
                );
                zOffsets[i] = (Math.random() - 0.5) * 2.0;
              }

              // Sanftes Aufnehmen (stärker bei aktiver Bewegung, kein Klumpen im Stillstand)
              const pickupBoost = smoothFactor * (0.28 + Math.min(0.55, ptr.speed * 2.6)) * dt;
              followWeights[i] = Math.min(1.0, followWeights[i] + pickupBoost);

              // Tangentiale Strömung (Velocity-Advection) entlang der Fingerbewegung
              const advect = (0.12 + smoothFactor * 0.22) * dt;
              vx += ptr.vx * advect;
              vy += ptr.vy * advect;
              vz += zOffsets[i] * smoothFactor * ptr.speed * 0.035 * dt;

              // Subtiles Aufleuchten beim Aufnehmen
              energies[i] = Math.min(0.95, energies[i] + smoothFactor * 0.32);
            }
          });
        }

        // 3. Organischer Sternenstaub-Schweif entlang der Pfad-Historie (kein Ball!)
        let fw = followWeights[i];
        if (fw > 0.002) {
          const ptr = activePointers.get(followPointerIds[i]);
          if (ptr && ptr.trail.length > 0) {
            const lag = trailLags[i];
            const trail = ptr.trail;
            const maxIdx = trail.length - 1;
            const floatIdx = lag * maxIdx;
            const idx0 = Math.floor(floatIdx);
            const idx1 = Math.min(maxIdx, idx0 + 1);
            const blend = floatIdx - idx0;

            const p0 = trail[idx0];
            const p1 = trail[idx1];

            // Interpolierter Referenzpunkt + Tangente/Normale auf der Zugbahn
            const baseX = p0.x + (p1.x - p0.x) * blend;
            const baseY = p0.y + (p1.y - p0.y) * blend;
            const ttx = p0.tx + (p1.tx - p0.tx) * blend;
            const tty = p0.ty + (p1.ty - p0.ty) * blend;
            const tnx = p0.nx + (p1.nx - p0.nx) * blend;
            const tny = p0.ny + (p1.ny - p0.ny) * blend;

            // Kometenhaftes Auffächern: vorne schmal, nach hinten breiter werdend
            const fanWidth = 0.34 + Math.pow(lag, 1.15) * 1.45;
            const fanZ = 0.26 + lag * 0.95;

            // Langsame, organische Wellen-/Curl-Drift im Schweif
            const waveLat = Math.sin(t * 1.35 + curlPhases[i] + lag * 4.2) * (0.10 + lag * 0.34);
            const waveZ = Math.cos(t * 1.05 + curlPhases[i] * 1.3) * (0.08 + lag * 0.24);

            const ribbonX = baseX + tnx * (lateralOffsets[i] * fanWidth + waveLat);
            const ribbonY = baseY + tny * (lateralOffsets[i] * fanWidth + waveLat);
            const ribbonZ = zOffsets[i] * fanZ + waveZ;

            const rdx = ribbonX - px;
            const rdy = ribbonY - py;
            const rdz = ribbonZ - pz;

            // Bei Stillstand sanft lockern, damit Partikel nie zusammenklumpen
            const moveFactor = Math.min(1.0, ptr.speed * 14.0);
            const followPull = (0.011 + (1.0 - lag) * 0.013) * (0.22 + 0.78 * moveFactor) * fw * dt;
            vx += rdx * followPull;
            vy += rdy * followPull;
            vz += rdz * followPull;

            // Sanfte Strömung entlang der Bahn-Tangente
            const flowPush = ptr.speed * (1.0 - lag * 0.65) * 0.095 * fw * dt;
            vx += ttx * flowPush;
            vy += tty * flowPush;

            // Hintere Schweif-Partikel fransen natürlich früher aus als vordere
            const baseDecay = moveFactor > 0.12
              ? (0.995 - lag * 0.013)
              : (0.976 - lag * 0.012);
            fw *= Math.pow(baseDecay, dt);

            // Zu weit entfernte Partikel lösen sich weich vom Schweif
            if (rdx * rdx + rdy * rdy > 32.0) {
              fw *= Math.pow(0.94, dt);
            }

            energies[i] = Math.max(energies[i], fw * (0.30 + (1.0 - lag) * 0.50));
          } else {
            // Finger/Maus losgelassen: Schweif löst sich weich auf und gleitet zurück
            fw *= Math.pow(0.935 - trailLags[i] * 0.024, dt);
          }

          if (fw < 0.002) {
            fw = 0;
            followPointerIds[i] = null;
          }
          followWeights[i] = fw;
        }

        // 4. Sanfte Federkraft zurück zur Textform (während des Schweifs auf ~10 % reduziert)
        const textSpringScale = 1.0 - fw * 0.90;
        const k = springKs[i] * springMultiplier * textSpringScale * dt;
        vx += (liveTx - px) * k;
        vy += (liveTy - py) * k;
        vz += (liveTz - pz) * k;

        // 5. Viskose Dämpfung & Geschwindigkeitslimit für dauerhaft ruhige Bewegung
        vx *= damping;
        vy *= damping;
        vz *= damping;

        const speedSq = vx * vx + vy * vy + vz * vz;
        if (speedSq > maxSpeedSq) {
          const scale = maxSpeed / Math.sqrt(speedSq);
          vx *= scale;
          vy *= scale;
          vz *= scale;
        }

        positions[i3] = px + vx * dt;
        positions[i3 + 1] = py + vy * dt;
        positions[i3 + 2] = pz + vz * dt;

        velocities[i3] = vx;
        velocities[i3 + 1] = vy;
        velocities[i3 + 2] = vz;

        // 6. Sanfte Farb- & Energie-Angleiche
        colors[i3] += (targetColors[i3] - colors[i3]) * colorLerp;
        colors[i3 + 1] += (targetColors[i3 + 1] - colors[i3 + 1]) * colorLerp;
        colors[i3 + 2] += (targetColors[i3 + 2] - colors[i3 + 2]) * colorLerp;

        energies[i] *= energyDecay;
      }

      // Zeiger-Geschwindigkeit weich abklingen lassen, wenn Finger/Maus ruht
      if (hasPointers) {
        activePointers.forEach((ptr) => {
          ptr.vx *= Math.pow(0.76, dt);
          ptr.vy *= Math.pow(0.76, dt);
          ptr.speed = Math.hypot(ptr.vx, ptr.vy);
        });
      }

      geometry.attributes.position.needsUpdate = true;
      geometry.attributes.color.needsUpdate = true;
      geometry.attributes.aEnergy.needsUpdate = true;

      renderer.render(scene, camera);
    }

    // =========================================================================
    // 9. START BEI WINDOW.ONLOAD
    // =========================================================================
    window.onload = function () {
      try {
        initThree();
        bindEvents();
        applyWord('Franyó', true);

        // Sobald Google Font „Inter 900“ komplett geladen ist, Cache erneuern für perfekte Akzente
        if (document.fonts && document.fonts.ready) {
          document.fonts.ready.then(() => {
            sampledWordCache.clear();
            applyWord(currentWord, false);
          }).catch(() => {});
        }

        lastTime = performance.now();
        requestAnimationFrame(animate);
      } catch (err) {
        console.error('Fehler beim Starten der 3D-Simulation:', err);
        if (errorBanner && errorText) {
          errorText.textContent = err && err.message ? err.message : 'Unbekannter WebGL-Fehler.';
          errorBanner.classList.remove('hidden');
        }
      }
    };
  </script>
</body>
